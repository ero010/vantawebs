<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScrubMeta — Remove Metadata</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">
  <h1>ScrubMeta</h1>
  <p class="sub">Drop a file. Get it back clean. Same quality, no metadata.</p>

  <div id="dropzone" class="dropzone">
    <div class="dz-icon">⇪</div>
    <div class="dz-text"><b>Drop file here</b> or <button id="pickBtn" class="linkbtn">browse</button></div>
    <div class="dz-hint">Images, PDFs, Video, Audio</div>
    <input id="fileInput" type="file" multiple hidden />
  </div>

  <div id="status" class="status hidden">
    <div class="spinner"></div>
    <span id="statusText">Cleaning...</span>
  </div>

  <div id="result" class="result hidden">
    <div class="check">&#10003;</div>
    <div class="result-text">
      <b id="resultName"></b>
      <span id="resultInfo"></span>
    </div>
    <button id="downloadBtn" class="btn">Download Clean File</button>
  </div>

  <div id="history" class="history"></div>

  <p class="footer">100% client-side. Files never leave your device.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/exifreader@4.23.7/dist/exif-reader.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
